<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F4F0E8">
  <title>Cereri — LUXARCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic,latin-ext" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <header class="admin-bar">
    <div class="container admin-bar-inner">
      <a class="brand" href="/admin">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 27 V16 a9 9 0 0 1 18 0 V27" /><path d="M3 27 H29" /><circle cx="16" cy="17" r="2.6" /></svg>
        <span>Cereri <em>LUXARCH</em></span>
      </a>
      <button class="btn btn-sm btn-ghost" id="logout" hidden>Ieșire</button>
    </div>
  </header>

  <main class="container admin-main">
    <!-- Autentificare -->
    <section id="view-login" class="admin-view" hidden>
      <form class="login-card" id="loginForm">
        <h1>Panou de administrare</h1>
        <p class="muted">Introduceți parola ca să vedeți cererile.</p>
        <label class="admin-label" for="pw">Parolă</label>
        <input class="admin-input" id="pw" type="password" autocomplete="current-password" required>
        <label class="show-pw"><input type="checkbox" id="showPw"> Arată parola</label>
        <button class="btn" type="submit" id="loginBtn">Intră</button>
        <p class="admin-msg" id="loginMsg" role="alert"></p>
      </form>
    </section>

    <!-- Lista -->
    <section id="view-list" class="admin-view" hidden>
      <h1 class="admin-title">Cereri</h1>
      <nav class="status-filter" id="filter" aria-label="Filtru după status"></nav>
      <p class="admin-msg" id="listMsg" role="status"></p>
      <ul class="req-list" id="list"></ul>
      <button class="btn btn-ghost btn-sm" id="more" hidden>Mai multe</button>
    </section>

    <!-- Detaliile unei cereri -->
    <section id="view-detail" class="admin-view" hidden>
      <a class="back" id="back" href="/admin">← Înapoi la listă</a>
      <div id="detail"></div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
